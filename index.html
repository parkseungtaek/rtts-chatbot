<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더쇼 26 RTTS 박사</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fa;--card:#fff;--ink:#14213d;--mute:#6b7488;--red:#c8102e;--navy:#0c2340;--me:#0c2340;--meink:#fff;--line:#e1e5ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1220;--card:#18203a;--ink:#e8ecf7;--mute:#98a2bd;--red:#ff4d63;--me:#c8102e;--meink:#fff;--line:#2a3558}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1220;--card:#18203a;--ink:#e8ecf7;--mute:#98a2bd;--red:#ff4d63;--me:#c8102e;--meink:#fff;--line:#2a3558}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px}
header b{font-size:17px}header small{opacity:.75;display:block;font-size:12px}
.logo{font-size:26px}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;word-break:break-word}
.m p{margin:0 0 6px}.m p:last-child{margin:0}.m ul,.m ol{margin:4px 0 6px;padding-left:20px}
.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--me);color:var(--meink);align-self:flex-end;border-bottom-right-radius:4px;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip:active{background:var(--line)}
form{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:9px 12px;font:inherit;max-height:110px}
button.send{border:0;background:var(--red);color:#fff;border-radius:14px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
button.send:disabled{opacity:.5}
.note{font-size:12px;color:var(--mute);text-align:center;padding:0 10px 6px}
</style>
</head>
<body>
<header><span class="logo">⚾</span><div><b>더쇼 26 RTTS 박사</b><small>Road to the Show 뉴비 전용 코치</small></div></header>
<div id="chat" aria-live="polite"></div>
<div class="note">AI 코치라 패치로 바뀐 내용은 틀릴 수 있어요. 게임 내 설명과 함께 확인하세요.</div>
<form id="f"><textarea id="q" rows="1" placeholder="RTTS에 대해 뭐든 물어보세요"></textarea><button class="send" id="b">전송</button></form>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q'),btn=document.getElementById('b');
let hist=[],busy=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){let h='',l=null;const close=()=>{if(l){h+='</'+l+'>';l=null}};
for(const raw of t.split('\n')){const s=esc(raw).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
let m;if(m=s.match(/^\s*[-*•]\s+(.*)/)){if(l!=='ul'){close();h+='<ul>';l='ul'}h+='<li>'+m[1]+'</li>'}
else if(m=s.match(/^\s*\d+[.)]\s+(.*)/)){if(l!=='ol'){close();h+='<ol>';l='ol'}h+='<li>'+m[1]+'</li>'}
else{close();if(s.trim())h+='<p>'+s.replace(/^#+\s*/,'')+'</p>'}}
close();return h}
function add(cls,html,isText){const d=document.createElement('div');d.className='m '+cls;if(isText)d.textContent=html;else d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
const CHIPS=['처음 RTTS 만들 때 뭐부터 세팅해야 해?','선발투수 능력치·구종 추천해줘','투구 조작 방식 Pinpoint/Classic/Pulse 뭐가 좋아?','대학 갈까 바로 드래프트 갈까?','콜업 빠르게 되는 방법 알려줘','Bear Down Pitching이 뭐야?','퍼크는 뭘 먼저 사?','등판하면 자꾸 털려… 원인이 뭐야?'];
function intro(){add('bot','<p>안녕하세요! 저는 <b>RTTS 박사</b>예요 ⚾ 더쇼 26 Road to the Show에 관한 건 뭐든 물어보세요. 아래 질문으로 시작해도 좋아요.</p>');
const c=document.createElement('div');c.className='chips';CHIPS.forEach(t=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;b.onclick=()=>{c.remove();send(t)};c.appendChild(b)});chat.appendChild(c)}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;btn.disabled=true;q.value='';
add('me',text,true);hist.push({role:'user',content:text});
const out=add('bot','<p>생각 중…</p>');
try{const msgs=hist.slice(-12);while(msgs.length&&msgs[0].role!=='user')msgs.shift();
const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});
const r=await res.json();if(!res.ok)throw r;
out.innerHTML=md(r.text);hist.push({role:'assistant',content:r.text})}
catch(e){out.innerHTML='<p>답변을 가져오지 못했어요'+('')+'. 다시 보내주세요.</p>';hist.pop()}
finally{busy=false;btn.disabled=false;chat.scrollTop=chat.scrollHeight}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send(q.value)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(q.value)}});
intro();
</script>
</body>
</html>
